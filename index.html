  }
  toast(files.length === 1 ? 'Foto wird hochgeladen …' : `${files.length} Fotos werden hochgeladen …`);
  let failed = 0; let done = 0;
  await saveNow();
  for (const f of files) {
    try {
      const row = await uploadPhoto(jobId, await processImage(f), kind === 'before' ? { isBefore: true } : {});
      const { error } = await sb.from('photos').insert(row);
      if (error) throw error;
      data.photos.push(row); snapshot.photos.set(row.id, JSON.stringify(row)); done += 1;
    } catch { failed += 1; }
  }
  touchJob(jobId); commit();
  if (failed) toast(failed === 1 ? 'Ein Foto konnte nicht hochgeladen werden.' : `${failed} Fotos konnten nicht hochgeladen werden.`, true);
  else toast(done === 1 ? 'Foto gespeichert' : `${done} Fotos gespeichert`);
}
const needsBeforePhoto = (j) => !isBoss() && (j.status === 'new' || j.status === 'planned') && !data.photos.some((p) => p.jobId === j.id && p.isBefore);
const hasCompletionPhoto = (jobId) => data.photos.some((p) => p.jobId === jobId && p.isCompletion);
const storageUsed = () => data.photos.reduce((s, p) => s + (p.size || 0), 0);

// Statuswechsel: Abschluss nur mit Abschlussfoto
function requestStatus(j, status) {
  if (status === 'inProgress' && needsBeforePhoto(j)) { openSheet('start', { jobId: j.id }); return; }
  if (status === 'completed' && j.status !== 'completed' && !hasCompletionPhoto(j.id)) { openSheet('complete', { jobId: j.id }); return; }
  setStatus(j, status); commit(); toast(`Status: ${STATUS[status].t}`);
}

// ================= Einstellungen speichern =================
async function saveSetting(key, value) {
  try {
    if (key === 'userName') {
      const { error } = await sb.from('profiles').update({ name: value }).eq('id', data.me.id); if (error) throw error;
      data.me.name = value; const e = byId(data.employees, data.me.id); if (e) { e.name = value; snapshot.employees.set(e.id, JSON.stringify(e)); }
    } else if (['companyName', 'workdayStart', 'workdayEnd', 'defaultDuration'].includes(key)) {
      const col = key === 'companyName' ? 'name' : key;
      const { error } = await sb.from('companies').update({ [col]: value }).eq('id', data.company.id); if (error) throw error;
      data.company[col] = value;
    }
    data.settings[key] = value;
    render();
  } catch (e) { toast(friendlyError(e), true); }
}

// ================= Anmeldung =================
const auth = { mode: 'login', busy: false, error: '', join: 'boss', form: {} };
function authField(name, label, type = 'text', opt = {}) {
  return `<input class="field" id="af-${name}" name="${name}" type="${type}" value="${esc(auth.form[name] || '')}" placeholder="${esc(label)}"${opt.ac ? ` autocomplete="${opt.ac}"` : ''}${opt.cap ? ` autocapitalize="${opt.cap}"` : ''} aria-label="${esc(label)}" data-auth="${name}">`;
}
function renderAuth() {
  const app = document.getElementById('app');
  const logo = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px 8px"><span class="iconbox" style="width:72px;height:72px;border-radius:18px;background:var(--accent);color:#fff">${ic('drop', 38)}</span><h1 style="margin:6px 0 0;font-size:28px">SHK Pro</h1><p class="sub" style="margin:0;text-align:center">Aufträge, Termine und Team für Ihren SHK-Betrieb</p></div>`;
  const err = auth.error ? `<div class="err" style="padding:12px 32px 0">${ic('alert', 15)}<span>${esc(auth.error)}</span></div>` : '';
  const legalLinks = `<div class="sec-f" style="text-align:center;padding-top:20px"><button type="button" class="action" data-a="legal" data-k="terms">Nutzungsbedingungen</button> · <button type="button" class="action" data-a="legal" data-k="privacy">Datenschutz</button> · <button type="button" class="action" data-a="legal" data-k="imprint">Impressum</button></div>`;
  let body = '';
  if (auth.mode === 'login') {
    body = `${section('Anmelden', [authField('email', 'E-Mail', 'email', { ac: 'email', cap: 'none' }), authField('password', 'Passwort', 'password', { ac: 'current-password' })])}${err}
      <div class="pad" style="margin-top:20px"><button class="primary" type="button" data-a="authLogin"${auth.busy ? ' disabled' : ''}>${auth.busy ? 'Bitte warten …' : 'Anmelden'}</button></div>
      <div class="sec-f" style="text-align:center;padding-top:18px">Noch kein Konto? <button type="button" class="action" data-a="authMode" data-m="register">Registrieren</button></div>
      <div class="sec-f" style="text-align:center">Passwort vergessen? Wenden Sie sich an Ihren Chef oder an ${esc(LEGAL.email)}.</div>`;
  } else {
    const finishing = auth.mode === 'finish';
    body = `<div class="pad" style="margin-top:8px">${segmented(['Neuer Betrieb (Chef)', 'Mitarbeiter (mit Code)'], auth.join === 'boss' ? 0 : 1, 'authJoin')}</div>
      ${section(auth.join === 'boss' ? 'Ihr Betrieb' : 'Einladung', [
        auth.join === 'boss' ? authField('company', 'Name des Betriebs', 'text', { ac: 'organization' }) : authField('code', 'Einladungscode vom Chef', 'text', { cap: 'characters' }),
        authField('name', 'Ihr Name', 'text', { ac: 'name' }),
      ], { footer: auth.join === 'boss' ? 'Sie werden Chef dieses Betriebs und können Mitarbeiter per Code einladen.' : 'Den Code finden Chefs unter Einstellungen › Mitarbeiter.' })}
      ${finishing ? '' : section('Zugangsdaten', [authField('email', 'E-Mail', 'email', { ac: 'email', cap: 'none' }), authField('password', 'Passwort (mind. 8 Zeichen)', 'password', { ac: 'new-password' })])}
      <div class="sec"><div class="group"><label class="ctl" style="align-items:flex-start;padding:12px 16px"><span class="switch" style="margin-top:2px"><input type="checkbox" data-auth="terms"${auth.form.terms ? ' checked' : ''} aria-label="Bedingungen akzeptieren"><span></span></span><span style="flex:1;font-size:15px;line-height:1.35">Ich akzeptiere die <button type="button" class="action" data-a="legal" data-k="terms">Nutzungsbedingungen</button> und habe die <button type="button" class="action" data-a="legal" data-k="privacy">Datenschutzerklärung</button> gelesen.</span></label></div></div>
      ${err}
      <div class="pad" style="margin-top:20px"><button class="primary" type="button" data-a="authRegister"${auth.busy ? ' disabled' : ''}>${auth.busy ? 'Bitte warten …' : finishing ? 'Weiter' : 'Konto erstellen'}</button></div>
      ${finishing ? `<div class="sec-f" style="text-align:center;padding-top:18px"><button type="button" class="action" data-a="logout">Abmelden</button></div>` : `<div class="sec-f" style="text-align:center;padding-top:18px">Schon registriert? <button type="button" class="action" data-a="authMode" data-m="login">Anmelden</button></div>`}`;
  }
  app.innerHTML = `<main style="padding-bottom:48px;max-width:520px;margin:0 auto">${logo}${body}${legalLinks}</main>`;
}
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.auth; if (!k) return;
  auth.form[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset?.auth; if (k) auth.form[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
});
const authFail = (msg) => { auth.busy = false; auth.error = msg; renderAuth(); };
ACTIONS.authMode = (d) => { auth.mode = d.m; auth.error = ''; renderAuth(); };
ACTIONS.authJoin = (d) => { auth.join = +d.i === 0 ? 'boss' : 'worker'; auth.error = ''; renderAuth(); };
ACTIONS.authLogin = async () => {
  const f = auth.form;
  if (validate.email(f.email || '') || isBlank(f.email)) return authFail('Bitte eine gültige E-Mail-Adresse eingeben.');
  if (isBlank(f.password)) return authFail('Bitte das Passwort eingeben.');
  auth.busy = true; auth.error = ''; renderAuth();
  const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
  if (error) return authFail(friendlyError(error));
  auth.busy = false; auth.form.password = ''; boot();
};
ACTIONS.authRegister = async () => {
  const f = auth.form; const finishing = auth.mode === 'finish';
  if (auth.join === 'boss' && isBlank(f.company)) return authFail('Bitte den Namen des Betriebs eingeben.');
  if (auth.join === 'worker' && isBlank(f.code)) return authFail('Bitte den Einladungscode eingeben.');
  if (isBlank(f.name)) return authFail('Bitte Ihren Namen eingeben.');
  if (!finishing) {
    if (isBlank(f.email) || validate.email(f.email)) return authFail('Bitte eine gültige E-Mail-Adresse eingeben.');
    if (!f.password || f.password.length < 8) return authFail('Das Passwort muss mindestens 8 Zeichen lang sein.');
  }
  if (!f.terms) return authFail('Bitte akzeptieren Sie die Nutzungsbedingungen.');
  auth.busy = true; auth.error = ''; renderAuth();
  if (!finishing) {
    const { data: res, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.password });
    if (error) return authFail(friendlyError(error));
    if (!res.session) {
      auth.busy = false; auth.mode = 'login'; renderAuth();
      alertBox('E-Mail bestätigen', 'Wir haben Ihnen eine E-Mail geschickt. Bitte bestätigen Sie Ihre Adresse über den Link und melden Sie sich danach an.');
      return;
    }
  }
  const { error: rpcError } = auth.join === 'boss'
    ? await sb.rpc('create_company', { company_name: f.company.trim(), user_name: f.name.trim() })
    : await sb.rpc('join_company', { code: f.code.trim(), user_name: f.name.trim() });
  if (rpcError) { auth.mode = 'finish'; return authFail(friendlyError(rpcError)); }
  auth.busy = false; auth.form = {}; boot();
};
ACTIONS.logout = () => confirmBox('Abmelden?', 'Sie können sich jederzeit wieder anmelden.', 'Abmelden', async () => {
  await saveNow(); stopRealtime(); await sb.auth.signOut();
  data = emptyData(); snapshot = {}; signedCache.clear();
  for (const t of Object.keys(nav.stacks)) nav.stacks[t] = [{ s: ROOTS[t] }];
  nav.tab = 'dashboard'; auth.mode = 'login'; renderAuth();
}, false);
ACTIONS.deleteAccount = () => {
  const boss = isBoss();
  confirmBox(boss ? 'Betrieb und Konto löschen?' : 'Konto löschen?',
    boss ? 'Ihr Konto, der Betrieb und alle Daten (Kunden, Aufträge, Termine, Fotos) werden endgültig gelöscht. Mitarbeiter verlieren den Zugriff.' : 'Ihr Konto wird endgültig gelöscht. Erfasste Arbeitszeiten und Fotos bleiben beim Betrieb.',
    'Endgültig löschen', async () => {
      try {
        if (boss && data.photos.length) await sb.storage.from('photos').remove(data.photos.map((p) => p.path));
        const { error } = await sb.rpc('delete_my_account'); if (error) throw error;
        stopRealtime(); await sb.auth.signOut(); data = emptyData(); auth.mode = 'login'; renderAuth(); toast('Konto gelöscht');
      } catch (e) { toast(friendlyError(e), true); }
    });
};

// ================= Rechtstexte =================
const P = (t) => `<p>${t}</p>`;
const H = (t) => `<h3>${t}</h3>`;
function legalHtml(kind) {
  const L = Object.fromEntries(Object.entries(LEGAL).map(([k, v]) => [k, esc(v)]));
  const draft = `<p class="draft">Entwurf – bitte vor dem Einsatz rechtlich prüfen lassen. Stand: ${L.updated}</p>`;
  if (kind === 'imprint') {
    return draft + H('Angaben gemäß § 5 DDG') + P(`${L.provider}<br>${L.address}`) + H('Kontakt') + P(`Telefon: ${L.phone}<br>E-Mail: ${L.email}`)
      + (LEGAL.vat ? H('Umsatzsteuer-ID') + P(L.vat) : '')
      + H('Verantwortlich für den Inhalt') + P(`${L.provider}, Anschrift wie oben.`);
  }
  if (kind === 'privacy') {
    return draft
      + H('1. Verantwortlicher') + P(`${L.provider}, ${L.address}, E-Mail: ${L.email}. Bitte wenden Sie sich bei allen Fragen zum Datenschutz an diese Adresse.`)
      + H('2. Welche Daten wir verarbeiten')
      + P('<b>Kontodaten:</b> Name, E-Mail-Adresse, Passwort (nur verschlüsselt gespeichert), Rolle (Chef oder Mitarbeiter), Zugehörigkeit zu einem Betrieb.')
      + P('<b>Betriebsdaten:</b> Kunden (Namen, Kontaktdaten, Anschriften, Notizen), Immobilien und Anlagentechnik, Aufträge, Termine, Arbeitszeiten, Material sowie Fotos zu Aufträgen. Fotos werden beim Hochladen neu berechnet; Standortangaben (EXIF) werden dabei entfernt.')
      + P('<b>Technische Daten:</b> Beim Aufruf der App werden die IP-Adresse, Datum und Uhrzeit sowie Browser-Informationen von den unten genannten Dienstleistern technisch verarbeitet, um die App auszuliefern und abzusichern.')
      + H('3. Zwecke und Rechtsgrundlagen')
      + P('Wir verarbeiten die Daten, um die App bereitzustellen und den Nutzungsvertrag zu erfüllen (Art. 6 Abs. 1 lit. b DSGVO) sowie zur Gewährleistung der Sicherheit des Dienstes (Art. 6 Abs. 1 lit. f DSGVO). Die Verarbeitung von Mitarbeiterdaten wie Arbeitszeiten erfolgt im Rahmen des Beschäftigungsverhältnisses durch den jeweiligen Betrieb.')
      + P('Für die Daten seiner Kunden und Mitarbeiter, die ein Betrieb in der App erfasst, ist der Betrieb selbst verantwortlich. Soweit wir diese Daten im Auftrag des Betriebs verarbeiten, geschieht dies als Auftragsverarbeiter nach Art. 28 DSGVO.')
      + H('4. Dienstleister und Empfänger')
      + P('<b>Supabase Inc.</b> (USA) betreibt Datenbank, Anmeldung und Fotospeicher. Die Daten werden in einem Rechenzentrum in der Europäischen Union gespeichert. Mit Supabase besteht ein Vertrag zur Auftragsverarbeitung; für mögliche Zugriffe aus den USA gelten die EU-Standardvertragsklauseln bzw. das EU-U.S. Data Privacy Framework.')
      + P('<b>GitHub Inc.</b> (USA) stellt die App-Dateien über GitHub Pages bereit und verarbeitet dabei technische Zugriffsdaten.')
      + P('<b>jsDelivr</b> liefert eine benötigte Programmbibliothek aus; dabei wird Ihre IP-Adresse technisch verarbeitet.')
      + P('Eine Weitergabe an sonstige Dritte, Werbung oder Analyse-Dienste findet nicht statt.')
      + H('5. Speicherung im Browser') + P('Für die Anmeldung wird ein Sitzungsschlüssel im Speicher Ihres Browsers abgelegt. Das ist technisch erforderlich (§ 25 Abs. 2 TDDDG). Es werden keine Tracking-Cookies verwendet.')
      + H('6. Speicherdauer') + P('Daten werden gespeichert, solange das Konto bzw. der Betrieb besteht. Einzelne Einträge und Fotos können jederzeit in der App gelöscht werden. Unter Einstellungen › Konto löschen werden das Konto und – beim Chef – alle Daten des Betriebs endgültig gelöscht.')
      + H('7. Ihre Rechte') + P('Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch (Art. 15–21 DSGVO) sowie das Recht auf Beschwerde bei einer Datenschutz-Aufsichtsbehörde.')
      + H('8. Kontakt') + P(`${L.provider}, ${L.email}`);
  }
  return draft
    + H('1. Geltungsbereich') + P(`Diese Nutzungsbedingungen gelten für die Nutzung der App „SHK Pro“, bereitgestellt von ${L.provider}, ${L.address} (nachfolgend „Anbieter“).`)
    + H('2. Leistungen') + P('SHK Pro ist eine Software zur Verwaltung von Kunden, Aufträgen, Terminen, Arbeitszeiten, Material und Fotos für Handwerksbetriebe. Der Anbieter stellt die App in ihrer jeweils aktuellen Fassung kostenlos bereit. Ein Anspruch auf bestimmte Funktionen oder eine bestimmte Verfügbarkeit besteht nicht. Es gelten technische Grenzen, insbesondere für den Fotospeicher.')
    + H('3. Konten und Rollen') + P('Wer einen Betrieb anlegt, ist dessen Chef. Der Chef kann Mitarbeiter über einen Einladungscode hinzufügen, ihnen Aufträge zuweisen und ihren Zugang deaktivieren oder entfernen. Mitarbeiter sehen nur die ihnen zugewiesenen Aufträge und Termine. Zugangsdaten sind geheim zu halten; bei Verdacht auf Missbrauch ist das Passwort sofort zu ändern bzw. der Chef zu informieren.')
    + H('4. Abschluss von Aufträgen') + P('Ein Auftrag kann nur abgeschlossen werden, wenn mindestens ein Abschlussfoto der erledigten Arbeit hochgeladen wurde. Mitarbeiter sind verpflichtet, die erledigte Arbeit wahrheitsgemäß zu dokumentieren.')
    + H('5. Pflichten der Nutzer') + P('Die Nutzer sind für die eingegebenen Inhalte selbst verantwortlich. Insbesondere dürfen nur Daten erfasst werden, zu deren Verarbeitung der Betrieb berechtigt ist. Auf Fotos sollen keine Personen erkennbar sein, sofern keine Einwilligung vorliegt. Eine missbräuchliche Nutzung, etwa das Umgehen von Zugriffsbeschränkungen, ist untersagt.')
    + H('6. Datensicherung') + P('Der Anbieter bemüht sich um einen zuverlässigen Betrieb, schuldet aber keine Datensicherung. Chefs können unter Einstellungen eine Sicherung exportieren und sollten dies regelmäßig tun.')
    + H('7. Haftung') + P('Der Anbieter haftet unbeschränkt bei Vorsatz und grober Fahrlässigkeit, bei Verletzung von Leben, Körper oder Gesundheit sowie nach dem Produkthaftungsgesetz. Im Übrigen ist die Haftung für die kostenlose Bereitstellung ausgeschlossen, soweit gesetzlich zulässig.')
    + H('8. Laufzeit und Kündigung') + P('Die Nutzung kann jederzeit beendet werden, indem das Konto unter Einstellungen gelöscht wird. Der Anbieter kann den Dienst mit angemessener Frist einstellen oder Konten bei Verstößen gegen diese Bedingungen sperren.')
    + H('9. Änderungen') + P('Der Anbieter kann diese Bedingungen mit Wirkung für die Zukunft ändern. Über wesentliche Änderungen werden die Nutzer in der App informiert.')
    + H('10. Schlussbestimmungen') + P('Es gilt das Recht der Bundesrepublik Deutschland. Sollte eine Bestimmung unwirksam sein, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.');
}
const LEGAL_TITLES = { terms: 'Nutzungsbedingungen', privacy: 'Datenschutz', imprint: 'Impressum' };
SHEETS.legal = { init: (p) => ({ k: p.k }), title: (s) => LEGAL_TITLES[s.k], view: (s) => `<div class="legal">${legalHtml(s.k)}</div>` };
ACTIONS.legal = (d) => openSheet('legal', { k: d.k });

// ================= Start =================
async function boot() {
  const app = document.getElementById('app');
  if (!sb) {
    app.innerHTML = emptyState('alert', 'Verbindung nicht möglich', 'Die App konnte nicht vollständig geladen werden. Prüfen Sie Ihre Internetverbindung.', 'Erneut versuchen', 'reloadPage');
    return;
  }
  app.innerHTML = '<div class="empty" style="padding-top:40vh"><p>Daten werden geladen …</p></div>';
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { auth.mode = 'login'; renderAuth(); return; }
    const res = await loadAll();
    if (res === 'noprofile') { auth.mode = 'finish'; auth.error = ''; renderAuth(); return; }
    if (res === 'inactive') {
      app.innerHTML = `${emptyState('lock', 'Zugang deaktiviert', 'Ihr Zugang wurde vom Chef deaktiviert. Wenden Sie sich bitte an Ihren Betrieb.')}<div class="sec-f" style="text-align:center"><button type="button" class="action" data-a="logout">Abmelden</button></div>`;
      return;
    }
    nav.tab = 'dashboard';
    render(0);
    startRealtime();
  } catch (e) {
    app.innerHTML = emptyState('alert', 'Daten konnten nicht geladen werden', friendlyError(e), 'Erneut versuchen', 'retryBoot');
  }
}
ACTIONS.retryBoot = () => boot();
ACTIONS.reloadPage = () => location.reload();

if (sb) {
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && data.me) { stopRealtime(); data = emptyData(); auth.mode = 'login'; renderAuth(); }
  });
}
boot();
